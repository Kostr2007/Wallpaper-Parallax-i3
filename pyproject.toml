[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-parallax-i3"
version = "0.4.1"
description = "Android-style scrolling wallpaper for i3 on X11"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "python-xlib>=0.33"]

[project.scripts]
wallpaper-parallax = "wallpaper_parallax.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]
